# SHARED PORT 80
server {
    listen 80;
    server_name farmxnap-api.duckdns.org 
                farmxnap-staging-api.duckdns.org
                # For frontend: 
                farmxnap.duckdns.org 
                farmxnap-staging.duckdns.org;

    # For CertBot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all http to https
    location / {
        return 301 https://$host$request_uri;
    }
}

# PRODUCTION API
server {
    listen 443 ssl;
    server_name farmxnap-api.duckdns.org;

    # Point to the certificates
    ssl_certificate /etc/letsencrypt/live/farmxnap-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmxnap-api.duckdns.org/privkey.pem;

    include params/ssl_params;

    location / {
        proxy_pass http://app:3333;
        
        include params/proxy_params;
    }
}

# PRODUCTION FRONTEND
server {
    listen 443 ssl;
    server_name farmxnap.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/farmxnap.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmxnap.duckdns.org/privkey.pem;

    include params/ssl_params;

    root /var/www/farmxnap-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# STAGING API
server {
    listen 443 ssl;
    server_name farmxnap-staging-api.duckdns.org;

    # Point to the certificates
    ssl_certificate /etc/letsencrypt/live/farmxnap-staging-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmxnap-staging-api.duckdns.org/privkey.pem;

    include params/ssl_params;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://app-staging:3333;
        proxy_pass $upstream;
        include params/proxy_params;
    }
}

# STAGING FRONTEND
server {
    listen 443 ssl;
    server_name farmxnap-staging.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/farmxnap-staging.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmxnap-staging.duckdns.org/privkey.pem;

    include params/ssl_params;

    root /var/www/farmxnap-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}